plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	// Minecraft 26.3 ships unobfuscated, so no mappings are needed.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Only needed to offer the settings screen in Mod Menu, the mod works
	// without Mod Menu as well.
	compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	runtimeOnly "maven.modrinth:modmenu:${project.modmenu_version}"
	// The library that builds the settings screen, the same one the name
	// visibility mod uses.
	compileOnly "maven.modrinth:yacl:${project.yacl_version}"
	runtimeOnly "maven.modrinth:yacl:${project.yacl_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
